apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target: { kind: Deployment, name: frontend }
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target: { kind: Deployment, name: api }
  - patch: |-
      - op: add
        path: /spec/template/metadata/labels/region
        value: westeurope
    target: { kind: Deployment }
