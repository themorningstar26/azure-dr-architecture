trigger:
  branches:
    include: [main]
  paths:
    exclude: [infra/**, k8s/**, "*.md"]

pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: acrmyapp001
  IMAGE_TAG: $(Build.BuildId)

stages:
- stage: Test
  displayName: Run Tests
  jobs:
  - job: UnitTests
    steps:
    - script: cd app/frontend && npm ci && npm test
      displayName: Frontend tests
    - script: cd app/api && npm ci && npm test
      displayName: API tests
    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '**/junit.xml'

- stage: BuildPush
  displayName: Build and Push Images
  dependsOn: Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Docker
    steps:
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'sc-myapp-azure'
        KeyVaultName: 'kv-myapp-global'
        SecretsFilter: 'SP-CLIENT-ID,SP-CLIENT-SECRET'

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: 'sc-myapp-azure'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: az acr login --name $(ACR_NAME)

    - script: |
        docker build -t $(ACR_NAME).azurecr.io/frontend:$(IMAGE_TAG) -t $(ACR_NAME).azurecr.io/frontend:latest ./app/frontend
        docker push $(ACR_NAME).azurecr.io/frontend:$(IMAGE_TAG)
        docker push $(ACR_NAME).azurecr.io/frontend:latest
      displayName: Build push frontend

    - script: |
        docker build -t $(ACR_NAME).azurecr.io/api:$(IMAGE_TAG) -t $(ACR_NAME).azurecr.io/api:latest ./app/api
        docker push $(ACR_NAME).azurecr.io/api:$(IMAGE_TAG)
        docker push $(ACR_NAME).azurecr.io/api:latest
      displayName: Build push API

    - script: |
        sed -i "s|image:.*frontend.*|image: $(ACR_NAME).azurecr.io/frontend:$(IMAGE_TAG)|g" k8s/base/frontend-deploy.yaml
        sed -i "s|image:.*api.*|image: $(ACR_NAME).azurecr.io/api:$(IMAGE_TAG)|g" k8s/base/api-deploy.yaml
        git config user.email "pipeline@mycompany.com"
        git config user.name "Azure DevOps Pipeline"
        git add k8s/base/
        git commit -m "ci: update image tags to $(IMAGE_TAG) [skip ci]"
        git push
      displayName: Update k8s manifests and push
